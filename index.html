
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveConnect</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff5f7;color:#29212a;font-family:Arial,sans-serif}
header{background:#e83e70;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:28px}
main{max-width:500px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:18px;box-shadow:0 4px 20px #0001}
h2{color:#e83e70}
input,select,textarea{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}
button{width:100%;padding:15px;background:#e83e70;color:white;border:0;border-radius:10px;font-size:16px;margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:15px 5px;box-shadow:0 -2px 12px #0001}
nav span{color:#e83e70;font-size:13px}
small{color:#777}
</style>
</head>
<body>
<header>
<h1>❤️ LoveConnect</h1>
<p>Meet people. Make connections.</p>
</header>
<main>
<div class="card">
<h2>Welcome to LoveConnect</h2>
<p>Find genuine connections in Nigeria and around the world.</p>
<h3>Create your account</h3>
<input id="name" placeholder="Your full name">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">Create Account</button>
<p style="text-align:center">Already a member?</p>
<button onclick="login()">Log In</button>
<p id="message"></p>
<small>Free to use. No VIP membership or subscriptions.</small>
</div>
</main>
<nav>
<span>❤️ Discover</span>
<span>📍 Nearby</span>
<span>💌 Likes</span>
<span>👤 Profile</span>
<script 
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://bdwbkbbwrhdiaurqxlfk.supabase.co",
  "sb_publishable_LX0TxYKI521RS_qG0YFNOg_P568uSUp"
);

async function register() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  if (!name || !email || !password) {
    message.textContent = "Please fill in all fields.";
    return;
  }

  message.textContent = "Creating your account...";

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: name }
    }
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent = data.session
    ? "Account created! Welcome to LoveConnect."
    : "Account created! Please check your email to confirm your account.";
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  message.textContent = error
    ? error.message
    : "Welcome back to LoveConnect!";
}
                                                     </script>
</body>
</html>
